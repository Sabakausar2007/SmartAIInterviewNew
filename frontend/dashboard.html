<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Smart AI Interview Assistance</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
<div class="bg-glow"></div>
<div class="app-shell" id="app-shell-root"></div>

<template id="dashboard-template">
  <div class="card mb-24" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;">
    <div id="dashboard-robot-slot"></div>
    <div style="flex:1;min-width:220px;">
      <h2 id="welcome-heading" style="margin-bottom:4px;">Welcome back 👋</h2>
      <p class="text-muted" style="margin:0;">Ready for your next interview? Your AI Career Coach is here to help.</p>
    </div>
  </div>

  <div class="stat-grid mb-24">
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-comments"></i></div><div class="stat-label">Total Interviews</div><div class="stat-value" id="stat-interviews">—</div></div>
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-star"></i></div><div class="stat-label">Avg Score</div><div class="stat-value" id="stat-avg-score">—</div></div>
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-list-check"></i></div><div class="stat-label">Practice Questions</div><div class="stat-value" id="stat-mcq">—</div></div>
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-code"></i></div><div class="stat-label">Coding Problems Solved</div><div class="stat-value" id="stat-coding">—</div></div>
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-file-lines"></i></div><div class="stat-label">Resume Score</div><div class="stat-value" id="stat-resume">—</div></div>
    <div class="card stat-card"><div class="stat-icon"><i class="fa-solid fa-fire"></i></div><div class="stat-label">Practice Streak</div><div class="stat-value" id="stat-streak">—</div></div>
  </div>

  <div class="card mb-24">
    <div class="flex gap-16" style="align-items:flex-start;">
      <div style="flex-shrink:0;" id="recommendation-robot-slot"></div>
      <div style="flex:1;">
        <h3 style="margin-bottom:4px;">Your AI Preparation Plan</h3>
        <p class="text-muted" style="margin-bottom:14px;font-size:0.85rem;">Generated from your actual activity so far.</p>
        <ul id="recommendation-list" style="margin:0;"><li class="text-muted">Loading…</li></ul>
      </div>
    </div>
  </div>

  <h3 class="mb-16">Quick Actions</h3>
  <div class="stat-grid mb-24">
    <a href="mock-interview.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-comments"></i></div><h4 style="margin-bottom:2px;">Mock Interview</h4><p style="margin:0;font-size:0.85rem;">Start Now</p></a>
    <a href="resume.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-file-lines"></i></div><h4 style="margin-bottom:2px;">Resume Analyzer</h4><p style="margin:0;font-size:0.85rem;">Analyze Resume</p></a>
    <a href="practice.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-list-check"></i></div><h4 style="margin-bottom:2px;">Practice Interview</h4><p style="margin:0;font-size:0.85rem;">Start Practice</p></a>
    <a href="question-bank.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-layer-group"></i></div><h4 style="margin-bottom:2px;">Question Bank</h4><p style="margin:0;font-size:0.85rem;">Explore Questions</p></a>
    <a href="coding-practice.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-code"></i></div><h4 style="margin-bottom:2px;">Coding Practice</h4><p style="margin:0;font-size:0.85rem;">Solve Problems</p></a>
    <a href="performance.html" class="card card-hover" style="text-decoration:none;"><div class="stat-icon"><i class="fa-solid fa-chart-line"></i></div><h4 style="margin-bottom:2px;">View Progress</h4><p style="margin:0;font-size:0.85rem;">Check Stats</p></a>
  </div>

  <div class="grid-2" style="grid-template-columns: 1.3fr 1fr; align-items:start;">
    <div class="card">
      <div class="flex-between mb-16"><h3 style="margin:0;">Recent Interviews</h3><a href="history.html" style="font-size:0.85rem;">View all</a></div>
      <div id="recent-interviews-wrap"><div class="loading-block"><span class="spinner"></span> Loading…</div></div>
    </div>
    <div class="card">
      <div class="flex-between mb-16"><h3 style="margin:0;">Recent Quiz Results</h3><a href="practice.html" style="font-size:0.85rem;">Practice more</a></div>
      <div id="recent-quizzes-wrap"><div class="loading-block"><span class="spinner"></span> Loading…</div></div>
    </div>
  </div>
</template>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
