<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Profile — Smart AI Interview Assistance</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
<div class="bg-glow"></div>
<div class="app-shell" id="app-shell-root"></div>

<template id="profile-template">
  <div class="card" style="max-width:640px;">
    <div class="flex gap-16 mb-24" style="align-items:center;">
      <div class="avatar" id="profile-avatar" style="width:64px;height:64px;font-size:1.4rem;">--</div>
      <div><h3 style="margin-bottom:2px;" id="profile-name-display">—</h3><p class="text-muted" style="margin:0;" id="profile-email-display">—</p></div>
    </div>
    <form id="profile-form">
      <div class="field"><label>Full Name</label><input type="text" id="full_name" /></div>
      <div class="field"><label>Email</label><input type="email" id="email" disabled /><div class="hint">Email cannot be changed.</div></div>
      <div class="input-row">
        <div class="field"><label>Phone</label><input type="tel" id="phone" placeholder="+91 98765 43210" /></div>
        <div class="field"><label>Job Role</label><input type="text" id="job_role" placeholder="e.g. Software Developer" /></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Education</label><input type="text" id="education" placeholder="e.g. B.Sc. IT" /></div>
        <div class="field"><label>College</label><input type="text" id="college" placeholder="e.g. ABC University" /></div>
      </div>
      <div class="field"><label>Skills</label><textarea id="skills" rows="2" placeholder="e.g. Python, JavaScript, SQL"></textarea></div>
      <div class="input-row">
        <div class="field"><label>Languages</label><input type="text" id="languages" placeholder="e.g. Python, JavaScript, C++" /></div>
        <div class="field"><label>Experience</label><input type="text" id="experience" placeholder="e.g. Fresher" /></div>
      </div>
      <button type="submit" class="btn btn-primary" id="profile-save-btn">Save Changes</button>
    </form>
  </div>
</template>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/profile.js"></script>
</body>
</html>
