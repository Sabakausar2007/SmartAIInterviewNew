<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Smart AI Interview Assistance</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 20px; }
  .auth-card { width: 100%; max-width: 420px; }
  .auth-card .brand { justify-content: center; margin-bottom: 26px; }
  .auth-panel { padding: 36px; }
  .auth-panel h2 { text-align: center; } .auth-panel p.sub { text-align: center; margin-bottom: 26px; }
  .auth-switch { text-align: center; margin-top: 18px; font-size: 0.9rem; color: var(--text-muted); }
  .divider-tab { display: flex; background: rgba(255,255,255,0.03); border-radius: 999px; padding: 4px; margin-bottom: 24px; }
  .divider-tab button { flex: 1; border: none; background: none; padding: 9px; border-radius: 999px; font-weight: 600; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; }
  .divider-tab button.active { background: var(--grad-main); color: #fff; }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="auth-wrap">
  <div class="auth-card fade-in-up">
    <a href="index.html" class="brand"><span class="brand-mark"><i class="fa-solid fa-brain"></i></span>Smart AI Interview</a>
    <div class="card auth-panel">
      <div class="divider-tab"><button type="button" class="active" id="tab-user">User Login</button><button type="button" id="tab-admin">Admin Login</button></div>
      <h2 id="form-title">Welcome back</h2>
      <p class="sub text-muted" id="form-sub">Log in to continue practicing.</p>
      <div id="expired-banner" class="error-state hidden mb-16">Your session expired. Please log in again.</div>
      <form id="login-form" novalidate>
        <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required /><div class="field-error">Enter a valid email address.</div></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required /><div class="field-error">Password is required.</div></div>
        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit"><span id="login-submit-label">Log In</span></button>
      </form>
      <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>
</div>
<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
