<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — Smart AI Interview Assistance</title>
<link rel="stylesheet" href="assets/css/style.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
<div class="bg-glow"></div>
<div class="app-shell" id="app-shell-root"></div>

<template id="settings-template">
  <div class="card" style="max-width:520px;">
    <h3 class="mb-16">Change Password</h3>
    <form id="password-form">
      <div class="field"><label>Current Password</label><input type="password" id="current_password" required /></div>
      <div class="field"><label>New Password</label><input type="password" id="new_password" required minlength="6" /><div class="hint">At least 6 characters.</div></div>
      <button type="submit" class="btn btn-secondary" id="password-save-btn">Change Password</button>
    </form>
    <div class="mt-24" style="border-top:1px solid var(--border); padding-top:20px;">
      <h4 class="mb-8">Logout</h4>
      <p class="text-muted" style="font-size:0.85rem;">End your current session on this device.</p>
      <button class="btn btn-danger" id="logout-btn">Logout</button>
    </div>
  </div>
</template>

<script src="assets/js/api.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
